<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Educa Finança</title>

  <link rel="stylesheet" href="../css/cadastro.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

  <div class="login-container">

    <div class="login-card">

      <div class="title-area">
        <span class="icon"></span>
        <h1>Cadastro da Conta</h1>
      </div>

      <form>

        <div class="input-grid">

          <div class="input-box">
            <label>Nome de usuário</label>
            <input type="email" placeholder="Digite seu username">
          </div>

          <div class="input-box">
            <label>E-mail</label>
            <input type="email" placeholder="Digite seu e-mail">
          </div>

          <div class="input-box">
            <label>Telefone</label>
            <input type="email" placeholder="Digite seu telefone">
          </div>

          <div class="input-box">
            <label>Senha</label>
            <input type="password" placeholder="Digite sua senha">
          </div>

        </div>

        <a href="../html/home.html" class="login-btn">
          Entrar
        </a>

        <p class="register-text">
         Possui conta?
          <a href="../html/login.html">Fazer Login</a>
        </p>

      </form>

    </div>

  </div>

</body>
</html>
