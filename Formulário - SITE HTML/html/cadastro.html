<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro - Educa Finança</title>

  <link rel="stylesheet" href="../css/cadastro.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="login-container">

    <div class="login-card">

      <div class="title-area">
        <span class="icon"></span>
        <h1>Cadastro da Conta</h1>
      </div>

      <form id="formCadastro">

        <div class="input-grid">

          <div class="input-box">
            <label>Nome de usuário</label>
            <input
              type="text"
              id="nome"
              placeholder="Digite seu username"
              required>
          </div>

          <div class="input-box">
            <label>E-mail</label>
            <input
              type="email"
              id="email"
              placeholder="Digite seu e-mail"
              required>
          </div>

          <div class="input-box">
            <label>Telefone</label>
            <input
              type="tel"
              id="telefone"
              placeholder="Digite seu telefone">
          </div>

          <div class="input-box">
            <label>Senha</label>
            <input
              type="password"
              id="senha"
              placeholder="Digite sua senha"
              required>
          </div>

        </div>

        <button type="submit" class="login-btn">
          Criar conta
        </button>

        <!-- DIVISOR -->

        <div class="divider">
          <span>ou</span>
        </div>

        <!-- GOOGLE -->

        <button
          type="button"
          id="googleLogin"
          class="google-btn">

          <img
            src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
            alt="Google">

          Continuar com Google

        </button>

        <p class="register-text">
          Possui conta?
          <a href="../html/login.html">Fazer Login</a>
        </p>

      </form>

    </div>

  </div>

  <!-- LOGIN COM GOOGLE -->
  <script type="module" src="../js/firebase-login.js"></script>

</body>

</html>
