<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Usuários - Educa Finança Admin</title>

    <link
        rel="stylesheet"
        href="../../css/admin.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    >
</head>

<body>

    <!-- MENU LATERAL -->

    <aside class="sidebar">

        <div class="logo">
            <h2>Educa Finança</h2>
            <span>ADMIN</span>
        </div>

        <nav>

            <a href="admin.html">
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </a>

            <a
                href="usuarios.html"
                class="ativo"
            >
                <i class="fa-solid fa-users"></i>
                Usuários
            </a>

            <a href="cursos.html">
                <i class="fa-solid fa-graduation-cap"></i>
                Cursos
            </a>

            <a href="resultados.html">
                <i class="fa-solid fa-square-poll-vertical"></i>
                Resultados
            </a>

            <button id="sair">

                <i class="fa-solid fa-right-from-bracket"></i>

                Sair

            </button>

        </nav>

    </aside>


    <!-- CONTEÚDO -->

    <main>

        <header class="topo">

            <div>

                <p>Painel Administrativo</p>

                <h1>Usuários</h1>

            </div>

            <div class="admin-info">

                <i class="fa-solid fa-circle-user"></i>

                <span id="nomeAdmin">
                    Administrador
                </span>

            </div>

        </header>


        <!-- CARDS -->

        <section class="cards cards-usuarios">

            <div class="card">

                <div class="card-icon">

                    <i class="fa-solid fa-users"></i>

                </div>

                <div>

                    <span>Total de usuários</span>

                    <h2 id="totalUsuarios">
                        0
                    </h2>

                </div>

            </div>


            <div class="card">

                <div class="card-icon">

                    <i class="fa-solid fa-user"></i>

                </div>

                <div>

                    <span>Plano Free</span>

                    <h2 id="totalFree">
                        0
                    </h2>

                </div>

            </div>


            <div class="card">

                <div class="card-icon">

                    <i class="fa-solid fa-crown"></i>

                </div>

                <div>

                    <span>Premium</span>

                    <h2 id="totalPremium">
                        0
                    </h2>

                </div>

            </div>

        </section>


        <!-- LISTA -->

        <section class="painel">

            <div class="cabecalho-tabela">

                <div>

                    <h2>
                        Usuários cadastrados
                    </h2>

                    <p>
                        Gerencie os usuários do Educa Finança.
                    </p>

                </div>


                <div class="pesquisa">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        id="pesquisarUsuario"
                        placeholder="Pesquisar usuário..."
                    >

                </div>

            </div>


            <div class="tabela-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Usuário</th>

                            <th>E-mail</th>

                            <th>Plano</th>

                            <th>Tipo</th>

                            <th>Ações</th>

                        </tr>

                    </thead>


                    <tbody id="tabelaUsuarios">

                        <tr>

                            <td colspan="6">

                                Carregando usuários...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- MODAL -->

    <div
        class="modal-admin"
        id="modalUsuario"
    >

        <div class="modal-admin-conteudo">

            <button
                type="button"
                class="modal-fechar"
                id="fecharModal"
            >
                ✕
            </button>

            <h2>
                Informações do usuário
            </h2>

            <div id="detalhesUsuario">
            </div>

        </div>

    </div>


    <script src="../../js/admin-usuarios.js"></script>

</body>

</html>
