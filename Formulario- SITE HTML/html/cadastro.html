<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Educa Finança</title>
  <link rel="stylesheet" href="../css/cadastro.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="title-area">
        <span class="icon"></span>
        <h1>Cadastro da Conta</h1>
      </div>
      <form id="formCadastro">
        <div class="input-grid">
          <div class="input-box">
            <label for="nome">Nome de usuário</label>
            <input type="text" id="nome" placeholder="Digite seu nome" autocomplete="name" required>
          </div>
          <div class="input-box">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email" required>
          </div>
          <div class="input-box">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="Digite seu telefone" autocomplete="tel">
          </div>
          <div class="input-box">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Crie uma senha (mínimo 6 caracteres)" autocomplete="new-password" minlength="6" required>
          </div>
        </div>
        <p id="mensagem" role="alert" aria-live="polite"></p>
        <button type="submit" class="login-btn" id="botaoCadastrar">Criar conta</button>
        <p class="register-text">Já possui conta? <a href="login.html">Fazer login</a></p>
      </form>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/cadastro.js"></script>
  <script src="../js/integracao-api.js"></script>
</body>
</html>
