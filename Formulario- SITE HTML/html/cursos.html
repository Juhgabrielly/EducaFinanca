<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cursos - Educa Finança</title>

  <link rel="stylesheet" href="../css/cursosht.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../css/chat.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
  >

</head>

<body>

  <header>

    <div class="logo">

      <img
        src="educa.png"
        alt="Logo do Educa Finança"
        class="logo-img"
      >

      <h2>Educa Finança</h2>

    </div>

    <button
      type="button"
      class="menu-toggle"
      id="menu-toggle"
      aria-label="Abrir menu"
    >

      <i class="fa-solid fa-bars"></i>

    </button>

    <nav class="menu" id="menu">

      <a href="home.html">Home</a>

      <a href="cursos.html" class="ativo">Cursos</a>

      <a href="relatorio.html">Relatórios</a>

      <a href="investimento.html">Investimentos</a>

      <a href="usuario.html">Perfil</a>

      <a href="plano.html">Planos</a>

    </nav>

  </header>

  <main>

    <section class="cursos-container">

      <div class="cabecalho-cursos">

        <span class="mini-titulo">
          APRENDIZADO FINANCEIRO
        </span>

        <h1>Cursos</h1>

        <p>
          Aprenda a cuidar melhor do seu dinheiro com conteúdos simples,
          práticos e organizados.
        </p>

      </div>


      <div class="grade-cursos" id="gradeCursos"><p>Carregando cursos do servidor...</p></div>

    </section>

  </main>

  <script>

    const toggle =
      document.getElementById("menu-toggle");

    const menu =
      document.getElementById("menu");


    toggle.addEventListener(
      "click",
      () => {

        menu.classList.toggle("active");

      }
    );


    document.addEventListener(
      "click",
      (event) => {

        const clicouNoMenu =
          menu.contains(event.target);

        const clicouNoBotao =
          toggle.contains(event.target);

        if (
          !clicouNoMenu &&
          !clicouNoBotao
        ) {

          menu.classList.remove("active");

        }

      }
    );

    function abrirCursoPremium(pagina) {

      const usuario =
        JSON.parse(
          localStorage.getItem("usuario")
        );

      if (!usuario) {

        alert(
          "Faça login para acessar este curso."
        );

        window.location.href =
          "login.html";

        return;

      }

      if (usuario.plano !== "PREMIUM") {

        const assinar =
          confirm(
            "⭐ Este conteúdo é exclusivo do EducaFinança+.\n\nDeseja conhecer o plano Premium?"
          );


        if (assinar) {

          window.location.href =
            "plano.html";

        }

        return;

      }

      window.location.href =
        pagina;

    }

  </script>


  <script src="../js/chat.js"></script>

  <script src="../js/api.js"></script>
  <script src="../js/integracao-api.js"></script>
<script src="../js/catalogo-cursos.js"></script>
</body>

</html>
