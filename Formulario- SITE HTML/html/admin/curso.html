<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cursos - Educa Finança</title>

    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            <h2>Educa Finança</h2>
            <span>PAINEL ADMINISTRATIVO</span>
        </div>

        <nav>

            <a href="admin.html">
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </a>

            <a href="usuarios.html">
                <i class="fa-solid fa-users"></i>
                Usuários
            </a>

            <a href="curso.html" class="ativo">
                <i class="fa-solid fa-graduation-cap"></i>
                Cursos
            </a>

            <a href="resultados.html">
                <i class="fa-solid fa-square-poll-vertical"></i>
                Resultados
            </a>

            <button id="sair" type="button">
                <i class="fa-solid fa-right-from-bracket"></i>
                Sair
            </button>

        </nav>

    </aside>

    <main class="main">

        <header class="topo">

            <div>
                <p>Painel Administrativo</p>
                <h1>Cursos</h1>
            </div>

            <div class="admin-info">
                <i class="fa-solid fa-shield-halved"></i>
                <span id="nomeAdmin">Administrador</span>
            </div>

        </header>

        <section class="painel">

            <div class="cabecalho-tabela">

                <div>
                    <h2>Cursos cadastrados</h2>
                    <p class="subtitulo">
                        Cadastre, edite ou remova cursos disponíveis no site.
                    </p>
                </div>

                <button class="btn" id="novoCurso" type="button">
                    <i class="fa-solid fa-plus"></i>
                    Novo curso
                </button>

            </div>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Descrição</th>
                            <th>Acesso</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaCursos">
                        <tr>
                            <td colspan="5" class="vazio">
                                Carregando...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

        <div class="modal" id="modalCurso">

            <div class="modal-conteudo">

                <div class="modal-topo">
                    <h2 id="tituloModalCurso">Novo curso</h2>

                    <button id="fecharModalCurso" type="button">
                        ×
                    </button>
                </div>

                <form id="formCurso">

                    <input type="hidden" id="cursoId">

                    <div class="form-grid">

                        <div class="campo largo">
                            <label for="tituloCurso">Título</label>
                            <input
                                type="text"
                                id="tituloCurso"
                                required
                                maxlength="150"
                            >
                        </div>

                        <div class="campo largo">
                            <label for="descricaoCurso">Descrição</label>
                            <textarea
                                id="descricaoCurso"
                                rows="3"
                            ></textarea>
                        </div>

                        <div class="campo largo">
                            <label for="conteudoCurso">
                                Conteúdo / link / texto
                            </label>

                            <textarea
                                id="conteudoCurso"
                                rows="6"
                            ></textarea>
                        </div>

                        <div class="campo">
                            <label for="exclusivoCurso">Acesso</label>

                            <select id="exclusivoCurso">
                                <option value="false">Gratuito</option>
                                <option value="true">Premium</option>
                            </select>
                        </div>

                    </div>

                    <div class="form-acoes">

                        <button
                            class="btn btn-sec"
                            type="button"
                            id="cancelarCurso"
                        >
                            Cancelar
                        </button>

                        <button class="btn" type="submit">
                            Salvar curso
                        </button>

                    </div>

                </form>

            </div>

        </div>

        <div id="mensagemAdmin" class="mensagem"></div>

    </main>

    <script src="../../js/api.js"></script>
    <script src="../../js/admin-cursos.js"></script>

</body>
</html>
