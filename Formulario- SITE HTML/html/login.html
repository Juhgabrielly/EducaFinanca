<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Educa Finança</title>
  <link rel="stylesheet" href="../css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="title-area">
        <span class="icon"></span>
        <h1>Login da Conta</h1>
      </div>
      <form id="formLogin">
        <div class="input-grid">
          <div class="input-box">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
          </div>
          <div class="input-box">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
          </div>
        </div>
        <p id="mensagem" role="alert" aria-live="polite"></p>
        <button type="submit" class="login-btn" id="botaoEntrar">Entrar</button>
        <p class="register-text">Não possui conta? <a href="cadastro.html">Criar cadastro</a></p>
      </form>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
  <script src="../js/integracao-api.js"></script>
</body>
</html>
