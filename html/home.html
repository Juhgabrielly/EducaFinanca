<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Educa Finança</title>

  <link rel="stylesheet" href="../css/home.css">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

  <header>

    <div class="logo">
      <img src="educa.png" class="logo-img">
      <h2>Educa Finança</h2>
    </div>

    <div class="menu-toggle" id="menu-toggle">
      ☰
    </div>

    <nav class="menu" id="menu">

      <a href="home.html">Home</a>

      <a href="cursos.html">Cursos</a>

      <a href="../html/relatório.html">Relatórios</a>

      <a href="../html/investimento.html">Investimentos</a>

      <a href="../html/usuario.html">Perfil</a>

    </nav>

  </header>

  <section class="home-cards">

    <h2>
      Sua jornada de
      <span>educação financeira</span>
    </h2>

    <a href="../html/cursos.html" class="home-card">

      <div class="left-card">

        <i class="fa-solid fa-book"></i>

        <div>
          <h3>Cursos</h3>
          <p>Aprenda finanças de forma prática.</p>
        </div>

      </div>

      <span class="arrow">›</span>

    </a>

    <a href="../html/relatório.html" class="home-card">

      <div class="left-card">

        <i class="fa-solid fa-list"></i>

        <div>
          <h3>Relatórios</h3>
          <p>Acompanhe seus resultados financeiros.</p>
        </div>

      </div>

      <span class="arrow">›</span>

    </a>

    <a href="../html/investimento.html" class="home-card">

      <div class="left-card">

        <i class="fa-solid fa-piggy-bank"></i>

        <div>
          <h3>Investimentos</h3>
          <p>Descubra novas oportunidades financeiras.</p>
        </div>

      </div>

      <span class="arrow">›</span>

    </a>

  </section>

  <script>

    const usuarioLogado = localStorage.getItem("usuarioLogado");

    if (!usuarioLogado) {
      alert("Faça login para acessar o sistema.");
      window.location.href = "login.html";
    }

    const toggle = document.getElementById("menu-toggle");
    const menu = document.getElementById("menu");

    toggle.addEventListener("click", () => {
      menu.classList.toggle("active");
    });

  </script>

</body>
</html>
