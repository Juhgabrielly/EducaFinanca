const API_DASHBOARD = "http://localhost:3000/dashboardfinanceiro";
const API_PROGRESSO = "http://localhost:3000/progressocursos";

const toggle = document.getElementById("menu-toggle");
const menu = document.getElementById("menu");

/*
ALTERE PARA O ID DO USUÁRIO LOGADO

const usuarioId = 15;


async function carregarUsuario(){

  try{

    const resposta = await fetch(
      `${API_USUARIOS}/buscar/${usuarioId}`
    );

    console.log("Status:", resposta.status);

    const usuario = await resposta.json();

    console.log("Usuario:", usuario);

    document.getElementById("nomePerfil").innerText =
      usuario.nome || "SEM NOME";

    document.getElementById("nome").value =
      usuario.nome || "";

    document.getElementById("email").value =
      usuario.email || "";

    document.getElementById("telefone").value =
      usuario.telefone || "";

    document.getElementById("cidade").value =
      usuario.cidade || "";

    document.getElementById("area_interesse").value =
      usuario.area_interesse || "";

  }catch(erro){

    console.error("ERRO:", erro);

  }

}

async function carregarDashboard(){

  try{

    const resposta = await fetch(
      `${API_DASHBOARD}/listar`
    );

    const dashboards = await resposta.json();

    const dashboard = dashboards.find(
      d => d.usuario_id == usuarioId
    );

    if(!dashboard) return;

    document.getElementById("saldoTotal").innerText =
      `R$ ${dashboard.saldo_total}`;

    document.getElementById("percentualInvestido").innerText =
      `${dashboard.percentual_investido}%`;

  }catch(erro){

    console.log(erro);

  }

}

async function carregarCursos(){

  try{

    const resposta = await fetch(
      `${API_PROGRESSO}/listar`
    );

    const cursos = await resposta.json();

    const concluidos = cursos.filter(
      curso =>
      curso.usuario_id == usuarioId &&
      curso.concluido === true
    );

    document.getElementById("cursosConcluidos").innerText =
      `${concluidos.length} Cursos`;

  }catch(erro){

    console.log(erro);

  }

}
