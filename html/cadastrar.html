<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastrar Meta - Educa Finança</title>

  <link rel="stylesheet" href="../css/cadastrar.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

  <div class="meta-container">

    <div class="meta-card">

      <h1>Nova Meta Financeira</h1>

      <p>
        Cadastre uma nova meta e acompanhe sua evolução financeira.
      </p>

      <div class="form-area">

        <div class="input-box">
          <label>Nome da Meta</label>
          <input type="text" id="nomeMeta" placeholder="Ex: Comprar um carro">
        </div>

        <div class="input-box">
          <label>Valor da Meta</label>
          <input type="number" id="valorMeta" placeholder="Ex: 40000">
        </div>

        <div class="input-box">
          <label>Porcentagem Atual</label>
          <input type="number" id="percentualMeta" placeholder="Ex: 45">
        </div>

        <button onclick="salvarMeta()" class="save-btn">
          Cadastrar Meta
        </button>

      </div>

    </div>

  </div>

  <script>

    async function salvarMeta() {

      const titulo = document.getElementById("nomeMeta").value;

      const valor_objetivo = Number(
        document.getElementById("valorMeta").value
      );

      const valor_atual = Number(
        document.getElementById("percentualMeta").value
      );

      if (!titulo || !valor_objetivo) {
        alert("Preencha todos os campos!");
        return;
      }

      try {

        const usuarioLogado = JSON.parse(
          localStorage.getItem("usuarioLogado")
        );

        if (!usuarioLogado) {
          alert("Faça login primeiro.");
          window.location.href = "login.html";
          return;
        }

        const resposta = await fetch(
          "http://localhost:3000/meta/cadastrar",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              titulo,
              valor_objetivo,
              valor_atual,
              usuario_id: usuarioLogado.id
            })
          }
        );

        const dados = await resposta.json();

        if (!resposta.ok) {
          console.log(dados);
          alert("Erro ao cadastrar meta.");
          return;
        }

        alert("Meta cadastrada com sucesso!");

        window.location.href = "investimento.html";

      } catch (erro) {

        console.error(erro);

        alert("Erro ao conectar com o servidor.");

      }

    }

  </script>

</body>
</html>
